name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run --extra dev ruff check app tests

      - name: Run core tests
        run: uv run --extra dev pytest tests/test_api.py tests/test_backtest_engine.py tests/test_backtest_fees.py tests/test_backtest_service.py tests/test_portfolio_builder.py tests/test_paper_execution.py tests/test_risk_service.py tests/test_strategy_templates.py -q

      - name: Run full test suite
        run: uv run --extra dev pytest -q

      - name: Alembic offline check
        run: uv run --extra dev alembic check
        continue-on-error: true

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Build
        run: npm run build
