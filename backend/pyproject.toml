[project]
name = "stock-master"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "A long-term maintainable quantitative trading platform for A-shares and ETFs."
readme = {text = "Stock Master is a local, single-user research and portfolio-management platform for A-shares and ETFs. It supports trusted data workflows, factor research, backtesting, portfolio planning, risk evaluation, and paper-only position simulation; it neither connects to brokers nor submits real orders.", content-type = "text/markdown"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.11.0",
    "duckdb>=1.3.0",
    "duckdb-engine>=0.17.0",
    "fastapi[standard]>=0.116.0",
    "pydantic-settings>=2.10.0",
    "pytz>=2026.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
data = [
    "akshare>=1.20.1",
    "pandas>=2.3.0",
]
backtest = [
    "backtrader>=1.9.78.123",
]
viz = [
    "plotly>=6.0.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]
all = [
    "akshare>=1.20.1",
    "backtrader>=1.9.78.123",
    "pandas>=2.3.0",
    "plotly>=6.0.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["libs/hithink_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = [
    "production_data: read-only audits against an explicitly selected production database",
]
