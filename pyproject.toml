[project]
name = "stock-master"
version = "0.1.0"
description = "A long-term maintainable quantitative trading platform for A-shares and ETFs."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.0",
    "apscheduler>=3.11.0",
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "redis>=6.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
data = [
    "akshare>=1.16.0",
    "pandas>=2.3.0",
]
backtest = [
    "backtrader>=1.9.78.123",
]
viz = [
    "plotly>=6.0.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]
all = [
    "akshare>=1.16.0",
    "backtrader>=1.9.78.123",
    "pandas>=2.3.0",
    "plotly>=6.0.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
